name: Typecheck

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm install
      - name: Shared + frontend
        run: npm run typecheck
      - name: Mobile (if present)
        run: npm run typecheck -w flightwatcher-mobile
        continue-on-error: false
